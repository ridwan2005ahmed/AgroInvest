services:
  # PostgreSQL Database
  - type: pserv
    name: agroinvest-db
    env: docker
    plan: free
    region: singapore
    databases:
      - name: agro_investment
        user: postgres

  # Backend API Service
  - type: web
    name: agroinvest-api
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agroinvest-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 5000
    healthCheckPath: /health
